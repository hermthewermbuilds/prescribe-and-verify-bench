<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>prescribe-and-verify — eval bench</title>
<style>
:root{
  --bg:#0e1013; --panel:#161a20; --panel2:#1c222a; --line:#2a323d;
  --fg:#e6eaf0; --dim:#8d99a8; --accent:#5aa9ff;
  --ok:#3ddc84; --bad:#ff5f56; --warn:#ffb454; --ca:#7d8797;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,"Segoe UI",sans-serif}
header{display:flex;align-items:center;gap:16px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:10;flex-wrap:wrap}
h1{font-size:14px;margin:0;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);font-weight:600}
#status{margin-left:auto;font-size:12px;color:var(--dim);font-family:var(--mono)}
main{padding:18px;max-width:1900px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button.act{background:var(--accent);border:none;color:#06121f;padding:7px 14px;border-radius:6px;cursor:pointer;font:inherit;font-weight:600}
button.act.ghost{background:transparent;border:1px solid var(--line);color:var(--fg);font-weight:400}
button.act:disabled{opacity:.4;cursor:not-allowed}
select,input[type=text],input[type=password]{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:inherit}
label.chk{display:flex;gap:6px;align-items:center;color:var(--dim);cursor:pointer}
.hint{color:var(--dim);font-size:12px}
.mono{font-family:var(--mono);font-size:12px}
.cols{display:flex;gap:12px;align-items:flex-start;overflow-x:auto;padding-bottom:8px}
.col{min-width:430px;flex:1 1 430px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.col>h3{margin:0;padding:9px 12px;border-bottom:1px solid var(--line);font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);display:flex;gap:8px;align-items:center}
.pane{border-top:1px solid var(--line)}
.pane>summary{padding:8px 12px;cursor:pointer;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);user-select:none}
.pane>div{padding:0 12px 12px}
.gate{padding:8px 12px;font-weight:600;border-radius:6px;margin:10px 12px}
.gate.ok{background:rgba(61,220,132,.12);color:var(--ok);border:1px solid rgba(61,220,132,.35)}
.gate.bad{background:rgba(255,95,86,.12);color:var(--bad);border:1px solid rgba(255,95,86,.35)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--dim);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
tr.mm td{background:rgba(255,95,86,.14)}
td.mm,span.mm,div.mm{background:rgba(255,95,86,.22);border-radius:3px;padding:0 3px}
.score{font-family:var(--mono);font-size:15px;font-weight:700}
.ca{color:var(--ca);font-style:italic;font-size:12px}
.bar{height:5px;background:var(--panel2);border-radius:3px;overflow:hidden;min-width:54px}
.bar>i{display:block;height:100%;background:var(--accent)}
.chip{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:1px 8px;font-size:11px;color:var(--dim);margin:1px 3px 1px 0}
.chip.bad{color:var(--bad);border-color:rgba(255,95,86,.4)}
.chip.ok{color:var(--ok);border-color:rgba(61,220,132,.4)}
.chip.warn{color:var(--warn);border-color:rgba(255,180,84,.4)}
pre{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;overflow:auto;max-height:460px;font-family:var(--mono);font-size:11px;margin:0}
.band{display:flex;gap:2px;margin-top:4px}
.band i{flex:1;height:6px;background:var(--panel2);border-radius:2px}
.band i.on{background:var(--accent)}
.filerow{display:flex;gap:8px;align-items:center;margin:4px 0}
.err{color:var(--bad);white-space:pre-wrap;font-family:var(--mono);font-size:12px}
.spin{color:var(--warn)}
img.thumb{width:38px;height:50px;object-fit:cover;border-radius:4px;border:1px solid var(--line);background:#000}
/* ---- live camera capture panel ---- */
.camwrap{position:fixed;inset:0;z-index:60;background:rgba(6,9,13,.82);display:flex;align-items:center;justify-content:center;padding:14px}
.campanel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;width:min(600px,100%);max-height:100%;overflow:auto}
.camstage{position:relative;height:min(58vh,540px);aspect-ratio:3/4;margin:10px auto;background:#000;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.camvideo{width:100%;height:100%;object-fit:cover;display:block}
.camvideo.mirrored{transform:scaleX(-1)}
.camguide{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.camposelabel{position:absolute;top:8px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#fff;text-shadow:0 1px 6px #000;pointer-events:none}
.camcount{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:92px;font-weight:700;color:#fff;text-shadow:0 2px 20px #000;pointer-events:none}
.camflash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .3s ease-out}
.camflash.on{opacity:.85;transition:none}
.camthumbs{display:flex;gap:8px;flex-wrap:wrap}
.camthumb{border:1px solid var(--line);border-radius:6px;padding:6px;text-align:center}
.camthumb img{display:block;width:84px;height:112px;object-fit:cover;border-radius:4px;background:#000}
button.chip{cursor:pointer;font:inherit;font-size:11px;line-height:1.5}
.chip.on{border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>
<header>
  <h1>prescribe &amp; verify · eval bench (hosted)</h1>
  <div id="status">loading…</div>
</header>
<main>
  <section id="tab-bench"></section>
</main>
<script type="module" src="./bench.js"></script>
</body>
</html>
